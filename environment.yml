name: ir-project
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Part 1
      - flask
      - beautifulsoup4
      - nltk
      # Part 2 (neural retrieval). The CS GPU servers' NVIDIA driver supports CUDA <= 12.4, and the
      # default PyPI torch wheel needs a newer driver ("driver too old"), so take the cu124 build.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.*
      - sentence-transformers==6.2.0
      - transformers==5.5.0
      - huggingface-hub>=1.5,<2
      - datasets>=3.6
      - accelerate>=1.2
      - numpy
      - scipy
      - matplotlib
